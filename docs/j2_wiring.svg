<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="540" fill="#ffffff"/>

  <!-- Board overview -->
  <text x="40" y="28" font-size="15" font-weight="600" fill="#222">SAROO board, component side</text>
  <path d="M60 50 H330 V470 H60 V300 H40 V250 H60 Z" fill="#1d4f9c" stroke="#0f2f63" stroke-width="2"/>
  <rect x="40" y="70" width="20" height="170" fill="#c9a24a"/>
  <rect x="40" y="310" width="20" height="150" fill="#c9a24a"/>
  <text x="50" y="500" font-size="11" fill="#555" text-anchor="middle">cartridge edge</text>
  <rect x="200" y="70" width="110" height="45" fill="#2b2b2b"/>
  <text x="255" y="97" font-size="12" fill="#ddd" text-anchor="middle">SDRAM</text>
  <rect x="295" y="135" width="22" height="60" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="306" y="215" font-size="11" fill="#e8e8e8" text-anchor="middle">J3</text>
  <rect x="140" y="200" width="95" height="95" fill="#3a3a3a"/>
  <text x="187" y="252" font-size="12" fill="#ddd" text-anchor="middle">FPGA</text>
  <rect x="140" y="330" width="95" height="95" fill="#3a3a3a"/>
  <text x="187" y="382" font-size="12" fill="#ddd" text-anchor="middle">STM32</text>
  <rect x="304" y="318" width="20" height="92" fill="#f39c12" stroke="#ffffff" stroke-width="1.5"/>
  <text x="300" y="430" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">J2</text>
  <line x1="324" y1="364" x2="420" y2="250" stroke="#f39c12" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- J2 close-up -->
  <text x="430" y="28" font-size="15" font-weight="600" fill="#222">J2, five pads</text>
  <rect x="500" y="80" width="40" height="340" rx="6" fill="#1d4f9c"/>
  <circle cx="520" cy="110" r="13" fill="#d9d9d9" stroke="#555"/>
  <circle cx="520" cy="180" r="13" fill="#d9d9d9" stroke="#555"/>
  <circle cx="520" cy="250" r="13" fill="#d9d9d9" stroke="#555"/>
  <circle cx="520" cy="320" r="13" fill="#d9d9d9" stroke="#555"/>
  <rect x="507" y="377" width="26" height="26" fill="#d9d9d9" stroke="#555"/>

  <g font-size="14" text-anchor="end">
    <text x="490" y="105" font-weight="700" fill="#222">G</text>
    <text x="490" y="122" font-size="11" fill="#555">ground</text>
    <text x="490" y="175" font-weight="700" fill="#999">C</text>
    <text x="490" y="192" font-size="11" fill="#999">leave free</text>
    <text x="490" y="245" font-weight="700" fill="#999">D</text>
    <text x="490" y="262" font-size="11" fill="#999">leave free</text>
    <text x="490" y="315" font-weight="700" fill="#222">T</text>
    <text x="490" y="332" font-size="11" fill="#555">SAROO sends</text>
    <text x="490" y="385" font-weight="700" fill="#222">R</text>
    <text x="490" y="402" font-size="11" fill="#555">SAROO receives</text>
  </g>
  <text x="520" y="445" font-size="11" fill="#555" text-anchor="middle">R is the square pad</text>

  <!-- Wires -->
  <line x1="533" y1="110" x2="700" y2="110" stroke="#333333" stroke-width="4"/>
  <line x1="533" y1="320" x2="700" y2="320" stroke="#27ae60" stroke-width="4"/>
  <line x1="533" y1="390" x2="700" y2="390" stroke="#2f80ed" stroke-width="4"/>

  <!-- Adapter -->
  <text x="700" y="28" font-size="15" font-weight="600" fill="#222">USB serial adapter</text>
  <rect x="708" y="80" width="150" height="340" rx="8" fill="#b02a2a"/>
  <rect x="696" y="102" width="16" height="16" fill="#e0c060" stroke="#555"/>
  <rect x="696" y="312" width="16" height="16" fill="#e0c060" stroke="#555"/>
  <rect x="696" y="382" width="16" height="16" fill="#e0c060" stroke="#555"/>
  <g font-size="14" font-weight="700" fill="#ffffff">
    <text x="722" y="115">GND</text>
    <text x="722" y="325">RXD</text>
    <text x="722" y="395">TXD</text>
  </g>
  <text x="783" y="200" font-size="12" fill="#ffffff" text-anchor="middle">set to 3.3 V</text>
  <text x="783" y="218" font-size="12" fill="#ffffff" text-anchor="middle">VCC not connected</text>
  <rect x="858" y="230" width="22" height="50" fill="#9a9a9a"/>
  <text x="890" y="300" font-size="11" fill="#555" text-anchor="start">USB</text>
  <text x="890" y="314" font-size="11" fill="#555" text-anchor="start">to PC</text>

  <!-- Footer -->
  <text x="40" y="525" font-size="12" fill="#444">G to GND · T to RXD · R to TXD · the Saturn powers the SAROO, so the adapter's VCC stays unconnected</text>
</svg>
